services:
  web:
    build: ./$APP_NAME
    container_name: $APP_NAME
    restart: unless-stopped
    volumes:
      - ./$APP_NAME:/app
    ports:
      - $PORT:$PORT
    environment:
      DATABASE_ENGINE: ${DATABASE_ENGINE}
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_HOST: ${POSTGRES_HOST}
      DATABASE_PORT: ${POSTGRES_PORT}
      PYTHONUNBUFFERED: 1
    env_file:
      - .env
    entrypoint:
      - /bin/sh
      - entrypoint.prd.sh
    depends_on:
      - db
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      # Routers

      # http
      - "traefik.http.routers.portfolio.rule=Host(`brianhornbrook.com`) || Host(`www.brianhornbrook.com`)"
      - "traefik.http.routers.portfolio.entrypoints=web"
      - "traefik.http.routers.portfolio.middlewares=redirect"

      # https
      - "traefik.http.routers.portfolio-secure.rule=Host(`portfolioelectric.com`) || Host(`www.portfolioelectric.com`)"
      - "traefik.http.routers.portfolio-secure.entrypoints=websecure"
      - "traefik.http.routers.portfolio-secure.tls.certresolver=myresolver"

      # Services
      - "traefik.http.services.portfolio-secure.loadbalancer.server.port=8000"

      # Redirect Scheme HTTP -> HTTPS
      - "traefik.http.middlewares.redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect.redirectscheme.permanent=true"

  db:
    image: postgres:17
    container_name: $APP_NAME-db
    volumes:
      - db-vol:/var/lib/postgresql/data:rw
      - ./db:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

volumes:
  db-vol:

networks:
  traefik_proxy:
    external: true