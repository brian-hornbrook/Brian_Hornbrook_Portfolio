<script>
  // Skill tab switching
  document.querySelectorAll('.skill-cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.skill-cat-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.skills-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      const panel = document.getElementById('panel-' + btn.dataset.panel);
      panel.classList.add('active');
      // Trigger bar animations
      panel.querySelectorAll('.skill-item').forEach(item => {
        item.classList.remove('visible');
        requestAnimationFrame(() => requestAnimationFrame(() => item.classList.add('visible')));
      });
    });
  });

  // Intersection observer for fade-ins and skill bars
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });

  document.querySelectorAll('.fade-in').forEach(el => io.observe(el));
  document.querySelectorAll('.skill-item').forEach(el => io.observe(el));

  // Active nav link highlighting
  const sections = document.querySelectorAll('section');
  const navLinks = document.querySelectorAll('nav a');
  window.addEventListener('scroll', () => {
    let current = '';
    sections.forEach(s => {
      if (window.scrollY >= s.offsetTop - 80) current = s.id;
    });
    navLinks.forEach(a => {
      a.style.color = a.getAttribute('href') === '#' + current ? 'var(--green)' : '';
    });
  });
</script>
</body>
</html>
